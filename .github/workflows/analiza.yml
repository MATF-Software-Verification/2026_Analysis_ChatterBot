name: Verifikacija ChatterBot-a

# pokrece sve alate na GitHub serveru

on:
  push:
  pull_request:
  workflow_dispatch:        # rucno pokretanje

jobs:
  analiza:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzimanje repozitorijuma zajedno sa submodulom
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Postavljanje Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalacija analiziranog projekta i alata
        run: |
          python -m pip install --upgrade pip
          pip install -e "./ChatterBot[dev]"
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      # prvo tri staticka alata, kao u radu; continue-on-error jer njihovi
      # nalazi treba da se vide a ne da obore CI
      - name: 1. flake8
        continue-on-error: true
        run: flake8 --max-line-length=100 --statistics ChatterBot/chatterbot

      - name: 2. mypy
        continue-on-error: true
        run: mypy --ignore-missing-imports --show-error-codes ChatterBot/chatterbot

      - name: 3. bandit
        continue-on-error: true
        run: bandit -r ChatterBot/chatterbot

      - name: 4. Jedinicni testovi i pokrivenost
        run: pytest tests/unit --cov=ChatterBot/chatterbot --cov-report=term-missing

      - name: 5. Integracioni testovi
        run: pytest tests/integration

      - name: 6. Property-based testovi
        run: pytest tests/property

      # PoC vraca 0 dok ranjivost postoji
      - name: Dokaz za bezbednosni nalaz
        run: python tools/bandit/poc_path_traversal.py
